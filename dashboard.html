<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard - Exchange_ur_needs</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin:0; font-family:Arial, sans-serif; background:#0d0d0d; color:#fff; }
    header { padding:15px; text-align:center; font-size:22px; font-weight:bold; color:#ff4f9a; }
    .box { max-width:400px; margin:20px auto; padding:25px; background:#1f1f1f; border-radius:16px; }
    h2 { margin-top:0; text-align:center; }
    .row { padding:10px 0; border-bottom:1px solid #333; }
    .row span { opacity:0.7; font-size:13px; display:block; }
    button { width:100%; margin-top:20px; padding:14px; border:none; border-radius:25px;
      background:linear-gradient(135deg,#6a00f4,#ff4f9a); color:#fff; font-size:17px; font-weight:bold; }
  </style>
</head>
<body>
  <header>Exchange_ur_needs</header>

  <div class="box">
    <h2 id="welcome">Loading...</h2>
    <div id="info"></div>
    <button id="logoutBtn">Logout</button>
  </div>

  <script>
    const db = supabase.createClient(
      'https://ffhxyxhmjaqrgtgsrabt.supabase.co',
      'sb_publishable_ldvPdgkT_QOelgFaNQqlVA_3h68AuH3'
    );

    async function load() {
      const { data: { session } } = await db.auth.getSession();

      // Not logged in? Send to login page
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      const { data: p, error } = await db
        .from('profiles')
        .select('*')
        .eq('id', session.user.id)
        .single();

      if (error || !p) {
        document.getElementById('welcome').textContent = 'Profile not found';
        return;
      }

      document.getElementById('welcome').textContent = 'Hi, ' + (p.full_name || 'Member') + ' 👋';

      const fields = [
        ['Gender', p.gender],
        ['Date of Birth', p.dob],
        ['City', p.city],
        ['Bio', p.bio || '-']
      ];

      const info = document.getElementById('info');
      fields.forEach(([label, value]) => {
        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = '<span>' + label + '</span>';
        div.appendChild(document.createTextNode(value || '-'));
        info.appendChild(div);
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await db.auth.signOut();
      window.location.href = 'login.html';
    });

    load();
  </script>
</body>
</html>
