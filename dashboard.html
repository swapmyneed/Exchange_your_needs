<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard - Exchange_ur_needs</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#0b0b10; --card:#16161f; --border:#26262f; --text:#f5f5f7; --muted:#a1a1aa;
      --grad:linear-gradient(135deg,#7c3aed,#ec4899); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',Arial,sans-serif; background:var(--bg); color:var(--text);
      background-image:radial-gradient(circle at top,rgba(124,58,237,0.3),transparent 60%); min-height:100vh; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border); }
    .logo { font-size:20px; font-weight:700; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; text-decoration:none; }
    .box { max-width:420px; margin:20px auto; padding:25px; background:var(--card); border:1px solid var(--border); border-radius:20px; }
    h2 { margin:0 0 4px; text-align:center; }
    .tagline-show { text-align:center; color:#f9a8d4; font-style:italic; margin:0 0 14px; min-height:20px; }
    .status { text-align:center; padding:12px; border-radius:14px; font-size:14px; margin-bottom:18px; }
    .pending { background:#f59e0b1f; border:1px solid #f59e0b66; color:#fcd34d; }
    .approved { background:#16a34a1f; border:1px solid #16a34a66; color:#4ade80; }
    .rejected { background:#dc26261f; border:1px solid #dc262666; color:#fca5a5; }
    .row { padding:10px 0; border-bottom:1px solid var(--border); }
    .row span { color:var(--muted); font-size:13px; display:block; }
    label { display:block; margin-top:18px; font-size:14px; color:var(--muted); }
    input { width:100%; padding:12px; margin-top:6px; border-radius:12px; border:1px solid #3f3f46; background:#0f0f15; color:#fff; font-size:15px; }
    .count { text-align:right; font-size:12px; color:var(--muted); }
    button, .btn { display:block; width:100%; margin-top:14px; padding:14px; border:none; border-radius:25px; background:var(--grad);
      color:#fff; font-size:16px; font-weight:600; text-align:center; text-decoration:none; font-family:inherit; }
    .btn-dark { background:#0f0f15; border:1px solid var(--border); }
    .section { margin-top:22px; font-size:13px; color:var(--muted); text-align:center; }
    #saveMsg { text-align:center; font-size:14px; min-height:20px; margin:8px 0 0; }
  </style>
</head>
<body>
  <nav><a href="index.html" class="logo">Exchange_ur_needs</a></nav>

  <div class="box">
    <h2 id="welcome">Loading...</h2>
    <p class="tagline-show" id="taglineShow"></p>
    <div id="status" class="status" style="display:none"></div>

    <a href="members.html" class="btn">💞 Browse Members</a>
    <a href="photos.html" class="btn">📸 My Photos</a>
    <a href="verify.html" class="btn">🎥 Video Verification</a>

    <div id="info"></div>

    <label for="tagline">Your tagline (shown on your profile)</label>
    <input id="tagline" maxlength="80" placeholder="e.g. Coffee lover looking for real conversations ☕">
    <div class="count"><span id="count">0</span>/80</div>
    <button id="saveBtn">Save Tagline</button>
    <p id="saveMsg"></p>

    <div id="adminBox" style="display:none">
      <p class="section">🛡️ Admin tools</p>
      <a href="review.html" class="btn btn-dark">🎥 Video Reviews</a>
      <a href="admin.html" class="btn btn-dark">🛡️ Admin Panel</a>
    </div>

    <button id="logoutBtn" class="btn-dark">Logout</button>
  </div>

  <script>
    const db = supabase.createClient(
      'https://ffhxyxhmjaqrgtgsrabt.supabase.co',
      'sb_publishable_ldvPdgkT_QOelgFaNQqlVA_3h68AuH3'
    );
    let userId = null;
    const $ = (id) => document.getElementById(id);

    function showStatus(s) {
      const box = $('status');
      const text = {
        pending:  '⏳ Not verified yet. Add your photos and finish video verification to go live.',
        approved: '✅ Verified member. Your profile is live.',
        rejected: '❌ Your profile was not approved. Please check your photos and record your video again.'
      };
      box.className = 'status ' + (s || 'pending');
      box.textContent = text[s] || text.pending;
      box.style.display = 'block';
    }

    async function load() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      userId = session.user.id;

      const { data: p, error } = await db.from('profiles').select('*').eq('id', userId).single();
      if (error || !p) { $('welcome').textContent = 'Profile not found'; return; }

      $('welcome').textContent = 'Hi, ' + (p.full_name || 'Member') + ' 👋';
      $('taglineShow').textContent = p.tagline ? '“' + p.tagline + '”' : '';
      $('tagline').value = p.tagline || '';
      $('count').textContent = (p.tagline || '').length;
      showStatus(p.status);
      if (p.is_admin) $('adminBox').style.display = 'block';

      const info = $('info');
      info.innerHTML = '';
      [['Gender', p.gender], ['Date of Birth', p.dob], ['City', p.city], ['Bio', p.bio]].forEach(([label, value]) => {
        const div = document.createElement('div');
        div.className = 'row';
        const span = document.createElement('span');
        span.textContent = label;
        div.appendChild(span);
        div.appendChild(document.createTextNode(value || '-'));
        info.appendChild(div);
      });
    }

    $('tagline').addEventListener('input', () => { $('count').textContent = $('tagline').value.length; });

    $('saveBtn').addEventListener('click', async () => {
      const btn = $('saveBtn');
      btn.disabled = true; btn.textContent = 'Saving...';
      const { error } = await db.from('profiles')
        .update({ tagline: $('tagline').value.trim() || null })
        .eq('id', userId);
      $('saveMsg').style.color = error ? '#fca5a5' : '#4ade80';
      $('saveMsg').textContent = error ? 'Error: ' + error.message : 'Saved ✅';
      btn.disabled = false; btn.textContent = 'Save Tagline';
      if (!error) load();
    });

    $('logoutBtn').addEventListener('click', async () => {
      await db.auth.signOut();
      window.location.href = 'login.html';
    });

    load();
  </script>
</body>
</html>
