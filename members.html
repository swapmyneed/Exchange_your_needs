<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members - Exchange_ur_needs</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#0b0b10; --card:#16161f; --border:#26262f; --text:#f5f5f7; --muted:#a1a1aa;
      --grad:linear-gradient(135deg,#7c3aed,#ec4899); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',Arial,sans-serif; background:var(--bg); color:var(--text);
      background-image:radial-gradient(circle at top,rgba(124,58,237,0.3),transparent 60%); min-height:100vh;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border); }
    .logo { font-size:20px; font-weight:700; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; text-decoration:none; }
    nav a.back { color:var(--muted); font-size:14px; text-decoration:none; }
    .wrap { max-width:480px; margin:18px auto; padding:0 14px; }
    h2 { text-align:center; margin:0 0 10px; }
    .warn { background:#dc26261f; border:1px solid #dc262666; color:#fca5a5; border-radius:14px; padding:10px 14px; font-size:13px; text-align:center; margin-bottom:16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:20px; overflow:hidden; margin-bottom:18px; }
    .pic { position:relative; aspect-ratio:3/4; background:#0f0f15; overflow:hidden; cursor:pointer; }
    .pic img { width:100%; height:100%; object-fit:cover; filter:blur(28px); transform:scale(1.15);
      transition:filter .25s; pointer-events:none; -webkit-user-drag:none; }
    .pic.show img { filter:none; transform:none; }
    .wm { position:absolute; inset:0; pointer-events:none; }
    .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-weight:600; font-size:16px; text-shadow:0 2px 8px #000; pointer-events:none; }
    .pic.show .hint { display:none; }
    .you { position:absolute; top:10px; left:10px; background:var(--grad); font-size:12px; font-weight:600; padding:3px 10px; border-radius:12px; }
    .info { padding:14px 16px; }
    .name { font-size:18px; font-weight:600; }
    .meta { color:var(--muted); font-size:13px; }
    .tag { color:#f9a8d4; font-style:italic; font-size:14px; margin-top:6px; }
    .empty { text-align:center; color:var(--muted); padding:30px; }
    .big { display:block; padding:14px; border-radius:25px; background:var(--grad); color:#fff; text-align:center; text-decoration:none; font-weight:600; margin-top:12px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Exchange_ur_needs</a>
    <a href="dashboard.html" class="back">← Dashboard</a>
  </nav>

  <div class="wrap">
    <h2>💞 Verified Members</h2>
    <div class="warn">⚠️ Every photo carries your member ID. Screenshots are traceable, and sharing photos gets you permanently banned.</div>
    <div id="list"><p class="empty">Loading...</p></div>
  </div>

  <script>
    const db = supabase.createClient(
      'https://ffhxyxhmjaqrgtgsrabt.supabase.co',
      'sb_publishable_ldvPdgkT_QOelgFaNQqlVA_3h68AuH3'
    );
    const $ = (id) => document.getElementById(id);
    let userId = null;

    // Block long-press menu, dragging and text selection
    ['contextmenu', 'dragstart', 'selectstart'].forEach(ev =>
      document.addEventListener(ev, e => e.preventDefault()));

    // Blur every photo again when the member leaves the page or switches apps
    function hideAll() { document.querySelectorAll('.pic.show').forEach(p => p.classList.remove('show')); }
    document.addEventListener('visibilitychange', () => { if (document.hidden) hideAll(); });
    window.addEventListener('blur', hideAll);
    window.addEventListener('pagehide', hideAll);

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    }
    function age(dob) {
      if (!dob) return '';
      const d = new Date(dob), n = new Date();
      let a = n.getFullYear() - d.getFullYear();
      if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--;
      return a;
    }

    // Repeating watermark with the VIEWER's ID and date
    function watermark(text) {
      const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='110'>" +
        "<text x='10' y='60' fill='rgba(255,255,255,0.28)' font-size='13' font-family='Arial' " +
        "transform='rotate(-25 100 55)'>" + text + "</text></svg>";
      return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
    }

    async function load(wmText) {
      const list = $('list');
      const { data: people, error } = await db.from('profiles')
        .select('id, full_name, dob, city, tagline').eq('status', 'approved');
      if (error) { list.innerHTML = ''; list.appendChild(el('p', 'empty', 'Error: ' + error.message)); return; }

      const ids = people.map(p => p.id);
      const { data: photos } = await db.from('profile_photos')
        .select('user_id, path, position').in('user_id', ids).order('position');

      // Main photo for each member
      const mainPath = {};
      (photos || []).forEach(ph => { if (!mainPath[ph.user_id]) mainPath[ph.user_id] = ph.path; });
      const paths = Object.values(mainPath);
      const urlFor = {};
      if (paths.length) {
        // Private links that stop working after 60 seconds
        const { data: urls } = await db.storage.from('profile-photos').createSignedUrls(paths, 60);
        (urls || []).forEach(u => { urlFor[u.path] = u.signedUrl; });
      }

      list.innerHTML = '';
      if (!people.length) { list.appendChild(el('p', 'empty', 'No verified members yet')); return; }

      const bg = watermark(wmText);
      for (const p of people) {
        const card = el('div', 'card');
        const pic = el('div', 'pic');
        const path = mainPath[p.id];
        if (path && urlFor[path]) {
          const img = el('img'); img.src = urlFor[path]; img.alt = '';
          pic.appendChild(img);
        }
        const wm = el('div', 'wm'); wm.style.backgroundImage = bg;
        pic.appendChild(wm);
        pic.appendChild(el('div', 'hint', path ? '👆 Tap to view' : 'No photo'));
        if (p.id === userId) pic.appendChild(el('span', 'you', 'You'));

        // Tap to reveal for 10 seconds
        let timer = null;
        pic.addEventListener('click', () => {
          if (!path) return;
          pic.classList.add('show');
          clearTimeout(timer);
          timer = setTimeout(() => pic.classList.remove('show'), 10000);
        });
        card.appendChild(pic);

        const info = el('div', 'info');
        const a = age(p.dob);
        info.appendChild(el('div', 'name', (p.full_name || 'Member') + (a ? ', ' + a : '')));
        info.appendChild(el('div', 'meta', '✅ Verified · ' + (p.city || '-')));
        if (p.tagline) info.appendChild(el('div', 'tag', '“' + p.tagline + '”'));
        card.appendChild(info);
        list.appendChild(card);
      }
    }

    (async function start() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      userId = session.user.id;

      const { data: me } = await db.from('profiles').select('status').eq('id', userId).single();
      if (!me || me.status !== 'approved') {
        const list = $('list'); list.innerHTML = '';
        list.appendChild(el('p', 'empty', '🔒 Only verified members can see profiles. Finish your photos and video verification first.'));
        const go = el('a', 'big', 'Verify Now'); go.href = 'photos.html';
        list.appendChild(go);
        return;
      }
      const wmText = 'ID ' + userId.slice(0, 8).toUpperCase() + ' · ' + new Date().toLocaleDateString('en-IN');
      load(wmText);
    })();
  </script>
</body>
</html>
