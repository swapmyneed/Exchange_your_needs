<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark – Dating</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0b14; color: #f5f5f7; }
  .glass { background: rgba(255,255,255,.06); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.12); }
  .neon { box-shadow: 0 0 25px rgba(236,72,153,.45); }
  .screen { display: none; }
  .screen.active { display: block; }
  input, select, textarea { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #ec4899; }
</style>
</head>
<body>

<!-- Header -->
<header class="glass sticky top-0 z-10 flex items-center justify-between px-4 py-3">
  <span class="text-xl font-extrabold text-pink-500">Spark</span>
  <nav id="nav" class="hidden gap-3 text-sm">
    <button onclick="show('discover')">Discover</button>
    <button onclick="show('matches')">Matches</button>
    <button onclick="show('premium')">Premium</button>
    <button onclick="logout()" class="text-gray-400">Logout</button>
  </nav>
</header>

<main class="mx-auto max-w-md p-4">

  <!-- AUTH -->
  <section id="auth" class="screen active">
    <div class="glass mt-8 rounded-2xl p-6">
      <h1 id="authTitle" class="mb-4 text-2xl font-extrabold">Log in</h1>

      <form id="loginForm" class="space-y-3" onsubmit="login(event)">
        <input name="email" type="email" placeholder="Email" required class="w-full rounded-lg p-3">
        <input name="password" type="password" placeholder="Password" required class="w-full rounded-lg p-3">
        <button class="neon w-full rounded-lg bg-pink-600 p-3 font-semibold">Log in</button>
      </form>

      <form id="registerForm" class="hidden space-y-3" onsubmit="register(event)">
        <input name="name" placeholder="Name" required class="w-full rounded-lg p-3">
        <input name="email" type="email" placeholder="Email" required class="w-full rounded-lg p-3">
        <input name="password" type="password" minlength="8" placeholder="Password (8+ chars)" required class="w-full rounded-lg p-3">
        <input name="age" type="number" min="18" placeholder="Age" required class="w-full rounded-lg p-3">
        <select name="gender" class="w-full rounded-lg p-3">
          <option value="male">Male</option><option value="female">Female</option><option value="other">Other</option>
        </select>
        <select name="lookingFor" class="w-full rounded-lg p-3">
          <option value="male">Looking for men</option><option value="female">Looking for women</option><option value="other">Looking for other</option>
        </select>
        <input name="city" placeholder="City" required class="w-full rounded-lg p-3">
        <textarea name="bio" placeholder="About you" class="w-full rounded-lg p-3"></textarea>
        <button class="neon w-full rounded-lg bg-pink-600 p-3 font-semibold">Create account</button>
      </form>

      <button onclick="toggleAuth()" class="mt-4 w-full text-sm text-gray-400 underline" id="toggleBtn">Create an account</button>
    </div>
  </section>

  <!-- DISCOVER -->
  <section id="discover" class="screen space-y-4">
    <h2 class="text-2xl font-extrabold">Discover <span id="planBadge" class="text-sm text-pink-500"></span></h2>
    <p id="limitInfo" class="text-sm text-gray-400"></p>
    <div id="cards" class="space-y-4"></div>
  </section>

  <!-- MATCHES -->
  <section id="matches" class="screen space-y-4">
    <h2 class="text-2xl font-extrabold">Your matches</h2>
    <div id="matchList" class="space-y-4"></div>
  </section>

  <!-- PREMIUM -->
  <section id="premium" class="screen space-y-4">
    <div class="glass rounded-2xl p-6 space-y-4">
      <h2 class="text-2xl font-extrabold">Spark Premium</h2>
      <ul class="list-disc pl-5 text-gray-300 space-y-1">
        <li>Unlimited likes every day</li>
        <li>See who liked you</li>
        <li>Priority in discovery</li>
      </ul>
      <p class="text-3xl font-extrabold">$9.99<span class="text-base text-gray-400">/month</span></p>
      <!-- Replace STRIPE_PAYMENT_LINK in the script with your real Stripe Payment Link -->
      <a id="subscribeBtn" href="#" target="_blank" class="neon block rounded-lg bg-pink-600 p-3 text-center font-semibold">Subscribe</a>
      <button onclick="demoUpgrade()" class="w-full rounded-lg border border-white/20 p-3 text-sm text-gray-300">Demo: activate Premium locally</button>
      <p id="premiumStatus" class="text-sm text-gray-400"></p>
    </div>
  </section>
</main>

<script>
/* ============ CONFIG ============ */
const FREE_DAILY_LIKES = 10;
const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/test_REPLACE_ME";

/* ============ STORAGE ============ */
const DB_KEY = "spark_db";
const SESSION_KEY = "spark_session";

const seedUsers = [
  { id: "d1", name: "Priya", age: 26, gender: "female", lookingFor: "male", city: "Bengaluru", bio: "Coffee, hikes and bad puns.", premium: false, password: "" },
  { id: "d2", name: "Ananya", age: 29, gender: "female", lookingFor: "male", city: "Bengaluru", bio: "Designer who loves street food.", premium: false, password: "" },
  { id: "d3", name: "Arjun", age: 28, gender: "male", lookingFor: "female", city: "Bengaluru", bio: "Runner, reader, weekend cook.", premium: false, password: "" }
];

function loadDB() {
  const db = JSON.parse(localStorage.getItem(DB_KEY) || "null");
  if (db) return db;
  const fresh = { users: seedUsers, likes: [] };
  localStorage.setItem(DB_KEY, JSON.stringify(fresh));
  return fresh;
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

let db = loadDB();
let currentUser = null;

/* ============ HELPERS ============ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const todayStart = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const myLikesToday = () => db.likes.filter(l => l.from === currentUser.id && l.at >= todayStart()).length;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "discover") renderDiscover();
  if (id === "matches") renderMatches();
  if (id === "premium") renderPremium();
}

/* ============ AUTH ============ */
function toggleAuth() {
  const loginOpen = !document.getElementById("loginForm").classList.contains("hidden");
  document.getElementById("loginForm").classList.toggle("hidden", loginOpen);
  document.getElementById("registerForm").classList.toggle("hidden", !loginOpen);
  document.getElementById("authTitle").textContent = loginOpen ? "Create account" : "Log in";
  document.getElementById("toggleBtn").textContent = loginOpen ? "I already have an account" : "Create an account";
}

function register(e) {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  if (Number(f.age) < 18) return alert("You must be 18 or older.");
  const email = f.email.toLowerCase().trim();
  if (db.users.some(u => u.email === email)) return alert("Email already registered.");
  const user = {
    id: "u" + Date.now(), name: f.name, email, password: f.password, age: Number(f.age),
    gender: f.gender, lookingFor: f.lookingFor, city: f.city, bio: f.bio || "", premium: false
  };
  db.users.push(user);
  saveDB(db);
  startSession(user);
}

function login(e) {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const user = db.users.find(u => u.email === f.email.toLowerCase().trim() && u.password === f.password);
  if (!user) return alert("Wrong email or password.");
  startSession(user);
}

function startSession(user) {
  localStorage.setItem(SESSION_KEY, user.id);
  currentUser = user;
  document.getElementById("nav").classList.remove("hidden");
  show("discover");
}

function logout() {
  localStorage.removeItem(SESSION_KEY);
  currentUser = null;
  document.getElementById("nav").classList.add("hidden");
  show("auth");
}

/* ============ DISCOVER ============ */
function renderDiscover() {
  const liked = new Set(db.likes.filter(l => l.from === currentUser.id).map(l => l.to));
  const list = db.users.filter(u =>
    u.id !== currentUser.id && !liked.has(u.id) &&
    u.gender === currentUser.lookingFor && u.lookingFor === currentUser.gender
  );

  document.getElementById("planBadge").textContent = currentUser.premium ? "(Premium)" : "";
  document.getElementById("limitInfo").textContent = currentUser.premium
    ? "Unlimited likes"
    : `Likes today: ${myLikesToday()} / ${FREE_DAILY_LIKES}`;

  const cards = document.getElementById("cards");
  if (!list.length) { cards.innerHTML = `<p class="text-gray-400">No new profiles right now. Check back soon.</p>`; return; }

  cards.innerHTML = list.map(u => `
    <div class="glass rounded-2xl p-5">
      <div class="mb-2 h-40 rounded-xl bg-gradient-to-br from-pink-600 to-purple-700 flex items-center justify-center text-5xl font-extrabold">${esc(u.name[0])}</div>
      <h3 class="text-lg font-bold">${esc(u.name)}, ${u.age} · ${esc(u.city)}</h3>
      <p class="text-gray-400 text-sm mb-3">${esc(u.bio)}</p>
      <button onclick="likeUser('${u.id}')" class="neon w-full rounded-lg bg-pink-600 p-2 font-semibold">Like ♥</button>
    </div>`).join("");
}

function likeUser(toId) {
  if (!currentUser.premium && myLikesToday() >= FREE_DAILY_LIKES) {
    return alert(`Free plan allows ${FREE_DAILY_LIKES} likes per day. Upgrade to Premium for unlimited likes.`);
  }
  db.likes.push({ from: currentUser.id, to: toId, at: Date.now() });
  saveDB(db);

  const mutual = db.likes.some(l => l.from === toId && l.to === currentUser.id);
  if (mutual) alert("It's a match! Check your Matches tab.");
  renderDiscover();
}

/* ============ MATCHES ============ */
function renderMatches() {
  const matches = db.users.filter(u =>
    db.likes.some(l => l.from === currentUser.id && l.to === u.id) &&
    db.likes.some(l => l.from === u.id && l.to === currentUser.id)
  );
  const el = document.getElementById("matchList");
  el.innerHTML = matches.length
    ? matches.map(u => `
        <div class="glass rounded-2xl p-5">
          <h3 class="text-lg font-bold">${esc(u.name)}, ${u.age} · ${esc(u.city)}</h3>
          <p class="text-gray-400 text-sm">${esc(u.bio)}</p>
        </div>`).join("")
    : `<p class="text-gray-400">No matches yet. Keep liking!</p>`;
}

/* ============ PREMIUM ============ */
function renderPremium() {
  document.getElementById("subscribeBtn").href = STRIPE_PAYMENT_LINK;
  document.getElementById("premiumStatus").textContent =
    currentUser.premium ? "Your Premium is active." : "Free plan: 10 likes per day.";
}

function demoUpgrade() {
  currentUser.premium = true;
  db.users = db.users.map(u => u.id === currentUser.id ? currentUser : u);
  saveDB(db);
  renderPremium();
}

/* ============ INIT ============ */
(function init() {
  const id = localStorage.getItem(SESSION_KEY);
  const user = id && db.users.find(u => u.id === id);
  if (user) startSession(user); else show("auth");
})();
</script>
</body>
</html>
