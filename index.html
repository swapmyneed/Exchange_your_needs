<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 360px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    h2 { margin-bottom: 16px; }
    input, button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 6px;
    }
    input { border: 1px solid #bbb; }
    button {
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #6b7280; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #message {
      margin-top: 14px;
      min-height: 22px;
      word-break: break-word;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>Login / Sign up</h2>

  <div id="auth-box">
    <input id="email" type="email" placeholder="Email" autocomplete="email" />
    <input id="password" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password" />
    <button id="signin-btn">Sign in</button>
    <button id="signup-btn" class="secondary">Sign up</button>
  </div>

  <div id="user-box" class="hidden">
    <p>Logged in as: <b id="user-email"></b></p>
    <button id="signout-btn" class="secondary">Sign out</button>
  </div>

  <p id="message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Your Supabase project details (the publishable key is safe in browser code)
    const SUPABASE_URL = "https://wswheiketugqozxgmywj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Rz71BtlDUKmj2IXsgeK9rw__MwmqiV-";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const authBox = document.getElementById("auth-box");
    const userBox = document.getElementById("user-box");
    const userEmail = document.getElementById("user-email");
    const signInBtn = document.getElementById("signin-btn");
    const signUpBtn = document.getElementById("signup-btn");
    const signOutBtn = document.getElementById("signout-btn");

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b91c1c" : "#15803d";
    }

    function setBusy(busy) {
      signInBtn.disabled = busy;
      signUpBtn.disabled = busy;
    }

    function getCredentials() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        showMessage("Please enter both email and password.", true);
        return null;
      }
      if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", true);
        return null;
      }
      return { email, password };
    }

    function updateUI(user) {
      if (user) {
        authBox.classList.add("hidden");
        userBox.classList.remove("hidden");
        userEmail.textContent = user.email;
      } else {
        authBox.classList.remove("hidden");
        userBox.classList.add("hidden");
        userEmail.textContent = "";
      }
    }

    signUpBtn.addEventListener("click", async () => {
      const creds = getCredentials();
      if (!creds) return;

      setBusy(true);
      try {
        const { data, error } = await supabaseClient.auth.signUp(creds);
        if (error) {
          showMessage("Error: " + error.message, true);
        } else if (data.session) {
          showMessage("Account created and logged in.");
        } else {
          showMessage("Account created. Check your email to confirm, then sign in.");
        }
      } catch (err) {
        showMessage("Something went wrong: " + err.message, true);
      } finally {
        setBusy(false);
      }
    });

    signInBtn.addEventListener("click", async () => {
      const creds = getCredentials();
      if (!creds) return;

      setBusy(true);
      try {
        const { error } = await supabaseClient.auth.signInWithPassword(creds);
        if (error) {
          showMessage("Error: " + error.message, true);
        } else {
          showMessage("Signed in.");
        }
      } catch (err) {
        showMessage("Something went wrong: " + err.message, true);
      } finally {
        setBusy(false);
      }
    });

    signOutBtn.addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      showMessage("Signed out.");
    });

    // Keep the screen in sync with the login state
    supabaseClient.auth.onAuthStateChange((_event, session) => {
      updateUI(session ? session.user : null);
    });

    // Check for an existing session when the page loads
    supabaseClient.auth.getSession().then(({ data }) => {
      updateUI(data.session ? data.session.user : null);
    });
  </script>
</body>
</html>
