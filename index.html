<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase Login Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 360px; margin: 40px auto; padding: 0 16px; }
    input, button { display: block; width: 100%; padding: 10px; margin: 8px 0; font-size: 16px; box-sizing: border-box; }
    button { cursor: pointer; }
    #message { margin-top: 12px; color: #333; word-break: break-word; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>Login / Sign up</h2>

  <div id="auth-box">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password (min 6 characters)" />
    <button id="signin-btn">Sign in</button>
    <button id="signup-btn">Sign up</button>
  </div>

  <div id="user-box" class="hidden">
    <p>Logged in as: <b id="user-email"></b></p>
    <button id="signout-btn">Sign out</button>
  </div>

  <p id="message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Your project details (the publishable key is safe for browser code)
    const SUPABASE_URL = "https://wswheiketugqozxgmywj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Rz71BtlDUKmj2IXsgeK9rw__MwmqiV-";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const authBox = document.getElementById("auth-box");
    const userBox = document.getElementById("user-box");
    const userEmail = document.getElementById("user-email");

    function showMessage(text) {
      message.textContent = text;
    }

    function updateUI(user) {
      if (user) {
        authBox.classList.add("hidden");
        userBox.classList.remove("hidden");
        userEmail.textContent = user.email;
      } else {
        authBox.classList.remove("hidden");
        userBox.classList.add("hidden");
        userEmail.textContent = "";
      }
    }

    document.getElementById("signup-btn").addEventListener("click", async () => {
      const { data, error } = await supabaseClient.auth.signUp({
        email: emailInput.value,
        password: passwordInput.value,
      });
      if (error) {
        showMessage("Error: " + error.message);
      } else if (data.session) {
        showMessage("Account created and logged in.");
      } else {
        showMessage("Account created. Check your email to confirm, then sign in.");
      }
    });

    document.getElementById("signin-btn").addEventListener("click", async () => {
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: emailInput.value,
        password: passwordInput.value,
      });
      if (error) {
        showMessage("Error: " + error.message);
      } else {
        showMessage("Signed in.");
      }
    });

    document.getElementById("signout-btn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      showMessage("Signed out.");
    });

    // Keep the screen in sync with the login state
    supabaseClient.auth.onAuthStateChange((_event, session) => {
      updateUI(session ? session.user : null);
    });
  </script>
</body>
</html>
