<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Account - Exchange_ur_needs</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#0b0b10; --card:#16161f; --border:#26262f; --text:#f5f5f7; --muted:#a1a1aa;
      --grad:linear-gradient(135deg,#7c3aed,#ec4899); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',Arial,sans-serif; background:var(--bg); color:var(--text);
      background-image:radial-gradient(circle at top,rgba(124,58,237,0.3),transparent 60%); min-height:100vh; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border); }
    .logo { font-size:20px; font-weight:700; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; text-decoration:none; }
    nav a.back { color:var(--muted); font-size:14px; text-decoration:none; }
    .box { max-width:420px; margin:20px auto; padding:24px; background:var(--card); border:1px solid var(--border); border-radius:20px; }
    h2 { margin:0 0 10px; text-align:center; }
    .warn { background:#dc26261f; border:1px solid #dc262666; color:#fca5a5; border-radius:14px; padding:12px 14px 12px 30px; font-size:14px; }
    .warn li { margin:4px 0; }
    label { display:block; margin-top:18px; font-size:14px; color:var(--muted); }
    input { width:100%; padding:12px; margin-top:6px; border-radius:12px; border:1px solid #3f3f46; background:#0f0f15; color:#fff; font-size:15px; }
    .big { display:block; width:100%; margin-top:14px; padding:14px; border:none; border-radius:25px; color:#fff;
      font-size:16px; font-weight:600; font-family:inherit; text-align:center; text-decoration:none; }
    .red { background:#dc2626; } .dark { background:#0f0f15; border:1px solid var(--border); }
    .big:disabled { opacity:0.4; }
    #msg { text-align:center; font-size:14px; min-height:20px; margin:10px 0 0; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Exchange_ur_needs</a>
    <a href="dashboard.html" class="back">← Dashboard</a>
  </nav>

  <div class="box">
    <h2>🗑️ Delete My Account</h2>
    <ul class="warn">
      <li>All your photos will be deleted forever</li>
      <li>Your verification video (if any) will be deleted</li>
      <li>Your profile and login will be removed</li>
      <li>This cannot be undone</li>
    </ul>

    <label for="confirm">Type <b>DELETE</b> to confirm</label>
    <input id="confirm" autocomplete="off" placeholder="DELETE">
    <button class="big red" id="delBtn" disabled>Delete Everything</button>
    <a href="dashboard.html" class="big dark">Cancel</a>
    <p id="msg"></p>
  </div>

  <script>
    const db = supabase.createClient(
      'https://ffhxyxhmjaqrgtgsrabt.supabase.co',
      'sb_publishable_ldvPdgkT_QOelgFaNQqlVA_3h68AuH3'
    );
    const $ = (id) => document.getElementById(id);
    let userId = null;

    function msg(text, ok) {
      $('msg').style.color = ok ? '#4ade80' : '#fca5a5';
      $('msg').textContent = text;
    }

    $('confirm').addEventListener('input', () => {
      $('delBtn').disabled = $('confirm').value.trim() !== 'DELETE';
    });

    $('delBtn').addEventListener('click', async () => {
      const btn = $('delBtn');
      btn.disabled = true; btn.textContent = 'Deleting...';
      try {
        // 1. Delete photo files
        const { data: ph } = await db.from('profile_photos').select('path').eq('user_id', userId);
        if (ph && ph.length) {
          const r = await db.storage.from('profile-photos').remove(ph.map(x => x.path));
          if (r.error) throw r.error;
        }
        // 2. Delete any remaining verification video
        const { data: vids } = await db.from('verifications')
          .select('video_path').eq('user_id', userId).not('video_path', 'is', null);
        if (vids && vids.length) {
          await db.storage.from('verification-videos').remove(vids.map(v => v.video_path));
        }
        // 3. Delete profile, records and login
        const { error } = await db.rpc('delete_my_account');
        if (error) throw error;

        try { await db.auth.signOut({ scope: 'local' }); } catch (e) {}
        msg('✅ Your account and all your data have been deleted.', true);
        btn.textContent = 'Deleted';
        setTimeout(() => { window.location.href = 'index.html'; }, 2500);
      } catch (e) {
        msg('Error: ' + e.message);
        btn.disabled = false; btn.textContent = 'Delete Everything';
      }
    });

    (async function start() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      userId = session.user.id;
    })();
  </script>
</body>
</html>
