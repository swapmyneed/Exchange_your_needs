<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Exchange_ur_needs</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#0b0b10; --card:#16161f; --border:#26262f; --text:#f5f5f7; --muted:#a1a1aa;
      --grad:linear-gradient(135deg,#7c3aed,#ec4899); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',Arial,sans-serif; background:var(--bg); color:var(--text); }
    nav { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border); }
    .logo { font-size:18px; font-weight:700; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; text-decoration:none; }
    nav a.back { color:var(--muted); font-size:14px; text-decoration:none; }
    .wrap { max-width:600px; margin:0 auto; padding:20px; }
    h1 { font-size:22px; margin:0 0 16px; }
    .tabs { display:flex; gap:8px; margin-bottom:18px; }
    .tab { flex:1; padding:10px 6px; border-radius:14px; border:1px solid var(--border); background:var(--card);
      color:var(--text); font-family:inherit; font-size:13px; font-weight:600; }
    .tab.active { background:var(--grad); border-color:transparent; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; }
    .name { font-size:17px; font-weight:600; }
    .meta { color:var(--muted); font-size:13px; margin:2px 0 8px; }
    .tagline { color:#f9a8d4; font-style:italic; font-size:14px; margin-bottom:6px; }
    .bio { font-size:14px; color:#d4d4d8; margin-bottom:12px; }
    .actions { display:flex; gap:8px; }
    .actions button { flex:1; padding:11px; border:none; border-radius:20px; font-family:inherit; font-weight:600; font-size:14px; color:#fff; }
    .ok { background:#16a34a; } .no { background:#dc2626; } .wait { background:#52525b; }
    .empty, #msg { text-align:center; color:var(--muted); padding:30px 0; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Exchange_ur_needs · Admin</a>
    <a href="dashboard.html" class="back">← Dashboard</a>
  </nav>

  <div class="wrap">
    <h1>🛡️ Member Verification</h1>
    <div class="tabs" id="tabs" style="display:none">
      <button class="tab active" data-s="pending">⏳ Pending <span id="c-pending"></span></button>
      <button class="tab" data-s="approved">✅ Approved <span id="c-approved"></span></button>
      <button class="tab" data-s="rejected">❌ Rejected <span id="c-rejected"></span></button>
    </div>
    <p id="msg">Checking access...</p>
    <div id="list"></div>
  </div>

  <script>
    const db = supabase.createClient(
      'https://ffhxyxhmjaqrgtgsrabt.supabase.co',
      'sb_publishable_ldvPdgkT_QOelgFaNQqlVA_3h68AuH3'
    );
    let current = 'pending';
    const $ = (id) => document.getElementById(id);

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function age(dob) {
      if (!dob) return '?';
      const d = new Date(dob), t = new Date();
      let a = t.getFullYear() - d.getFullYear();
      if (t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) a--;
      return a;
    }

    async function counts() {
      for (const s of ['pending', 'approved', 'rejected']) {
        const { count } = await db.from('profiles').select('id', { count: 'exact', head: true }).eq('status', s);
        $('c-' + s).textContent = '(' + (count || 0) + ')';
      }
    }

    async function setStatus(id, status) {
      const { data, error } = await db.from('profiles')
        .update({ status: status, reviewed_at: new Date().toISOString() })
        .eq('id', id).select();
      if (error || !data || !data.length) {
        alert('Could not update: ' + (error ? error.message : 'permission denied'));
        return;
      }
      loadList(); counts();
    }

    async function loadList() {
      const list = $('list');
      list.innerHTML = '';
      $('msg').textContent = 'Loading...';
      const { data, error } = await db.from('profiles').select('*').eq('status', current).order('full_name');
      if (error) { $('msg').textContent = 'Error: ' + error.message; return; }
      $('msg').textContent = '';
      if (!data.length) { list.appendChild(el('p', 'empty', 'No ' + current + ' members 🎉')); return; }

      data.forEach(p => {
        const card = el('div', 'card');
        card.appendChild(el('div', 'name', (p.full_name || 'No name') + (p.is_admin ? ' 🛡️' : '')));
        card.appendChild(el('div', 'meta', [p.gender || '-', age(p.dob) + ' yrs', p.city || '-'].join(' · ')));
        if (p.tagline) card.appendChild(el('div', 'tagline', '“' + p.tagline + '”'));
        card.appendChild(el('div', 'bio', p.bio || 'No bio'));

        const actions = el('div', 'actions');
        const add = (label, cls, status) => {
          const b = el('button', cls, label);
          b.onclick = () => setStatus(p.id, status);
          actions.appendChild(b);
        };
        if (current !== 'approved') add('✅ Approve', 'ok', 'approved');
        if (current !== 'rejected') add('❌ Reject', 'no', 'rejected');
        if (current !== 'pending') add('⏳ Pending', 'wait', 'pending');
        card.appendChild(actions);
        list.appendChild(card);
      });
    }

    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      current = t.dataset.s;
      loadList();
    }));

    (async function start() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      const { data: me } = await db.from('profiles').select('is_admin').eq('id', session.user.id).single();
      if (!me || !me.is_admin) { $('msg').textContent = '⛔ Admins only.'; return; }
      $('tabs').style.display = 'flex';
      counts(); loadList();
    })();
  </script>
</body>
</html>
