<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Exchange_ur_needs</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin:0; font-family:Arial, sans-serif; background:#0d0d0d; color:#fff; }
    header { padding:15px; text-align:center; font-size:22px; font-weight:bold; }
    header a { color:#ff4f9a; text-decoration:none; }
    .form-box { max-width:400px; margin:30px auto; padding:25px; background:#1f1f1f; border-radius:16px; }
    h2 { text-align:center; margin-top:0; }
    label { display:block; margin-top:14px; font-size:14px; opacity:0.85; }
    input { width:100%; padding:12px; margin-top:6px; border-radius:10px; border:1px solid #444;
      background:#2b2b2b; color:#fff; font-size:15px; box-sizing:border-box; }
    button { width:100%; margin-top:20px; padding:14px; border:none; border-radius:25px;
      background:linear-gradient(135deg,#6a00f4,#ff4f9a); color:#fff; font-size:17px; font-weight:bold; }
    button:disabled { opacity:0.6; }
    #msg { text-align:center; margin-top:15px; font-weight:bold; }
    .link { text-align:center; margin-top:15px; font-size:14px; }
    .link a { color:#ff4f9a; }
  </style>
</head>
<body>
  <header><a href="index.html">Exchange_ur_needs</a></header>

  <div class="form-box">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required>

      <label>Password</label>
      <input type="password" id="password" required>

      <button type="submit" id="loginBtn">Login</button>
      <p id="msg"></p>
    </form>
    <p class="link">New here? <a href="join.html">Create an account</a></p>
  </div>

  <script>
    const db = supabase.createClient(
      'https://ffhxyxhmjaqrgtgsrabt.supabase.co',
      'sb_publishable_ldvPdgkT_QOelgFaNQqlVA_3h68AuH3'
    );

    const msg = document.getElementById('msg');
    const btn = document.getElementById('loginBtn');

    // If already logged in, go straight to dashboard
    db.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'dashboard.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });

      if (error) {
        msg.style.color = '#ff6b6b';
        msg.textContent = 'Error: ' + error.message;
        btn.disabled = false;
        btn.textContent = 'Login';
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
