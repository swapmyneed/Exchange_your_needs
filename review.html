<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Reviews - Exchange_ur_needs</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#0b0b10; --card:#16161f; --border:#26262f; --text:#f5f5f7; --muted:#a1a1aa;
      --grad:linear-gradient(135deg,#7c3aed,#ec4899); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',Arial,sans-serif; background:var(--bg); color:var(--text);
      background-image:radial-gradient(circle at top,rgba(124,58,237,0.3),transparent 60%); min-height:100vh;
      -webkit-user-select:none; user-select:none; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border); }
    .logo { font-size:20px; font-weight:700; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; text-decoration:none; }
    nav a.back { color:var(--muted); font-size:14px; text-decoration:none; }
    .wrap { max-width:480px; margin:20px auto; padding:0 14px; }
    h2 { text-align:center; margin:0 0 4px; }
    .sub { text-align:center; color:var(--muted); font-size:13px; margin:0 0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:18px; margin-bottom:18px; }
    .name { font-size:18px; font-weight:600; }
    .meta { color:var(--muted); font-size:13px; margin-bottom:12px; }
    .challenge { background:#0f0f15; border:1px solid #7c3aed; border-radius:12px; padding:10px; font-size:14px; text-align:center; margin:10px 0; }
    .challenge b { color:#f9a8d4; }
    video { width:100%; border-radius:14px; background:#000; aspect-ratio:3/4; object-fit:cover; }
    .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
    .photos img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; pointer-events:none; -webkit-touch-callout:none; }
    .check { font-size:13px; color:#d4d4d8; margin:12px 0 0; padding-left:18px; }
    .btns { display:flex; gap:10px; margin-top:14px; }
    .btns button { flex:1; padding:13px; border:none; border-radius:22px; font-size:15px; font-weight:600; font-family:inherit; color:#fff; }
    .ok { background:#16a34a; } .no { background:#dc2626; }
    button:disabled { opacity:0.4; }
    #msg { text-align:center; font-size:14px; min-height:20px; }
    .empty { text-align:center; color:var(--muted); padding:30px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Exchange_ur_needs</a>
    <a href="admin.html" class="back">← Admin Panel</a>
  </nav>

  <div class="wrap">
    <h2>🎥 Video Reviews</h2>
    <p class="sub">Compare the video with the photos. The video is deleted after you decide.</p>
    <p id="msg"></p>
    <div id="list"><p class="empty">Loading...</p></div>
  </div>

  <script>
    const db = supabase.createClient(
      'https://ffhxyxhmjaqrgtgsrabt.supabase.co',
      'sb_publishable_ldvPdgkT_QOelgFaNQqlVA_3h68AuH3'
    );
    const $ = (id) => document.getElementById(id);
    let adminId = null;

    document.addEventListener('contextmenu', e => e.preventDefault());

    function msg(text, ok) {
      $('msg').style.color = ok ? '#4ade80' : '#fca5a5';
      $('msg').textContent = text || '';
    }
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    }
    function age(dob) {
      if (!dob) return '?';
      const d = new Date(dob), n = new Date();
      let a = n.getFullYear() - d.getFullYear();
      if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--;
      return a;
    }

    async function load() {
      const list = $('list');
      const { data: items, error } = await db.from('verifications')
        .select('*').eq('status', 'pending').not('video_path', 'is', null)
        .order('created_at');
      if (error) { list.innerHTML = ''; msg('Error: ' + error.message); return; }
      list.innerHTML = '';
      if (!items.length) { list.appendChild(el('p', 'empty', '🎉 No videos waiting for review')); return; }

      for (const v of items) {
        const card = el('div', 'card');
        const { data: p } = await db.from('profiles')
          .select('full_name, gender, dob, city').eq('id', v.user_id).single();

        card.appendChild(el('div', 'name', (p && p.full_name) || 'Member'));
        card.appendChild(el('div', 'meta',
          'Age ' + age(p && p.dob) + ' · ' + ((p && p.gender) || '-') + ' · ' + ((p && p.city) || '-')));

        const ch = el('div', 'challenge');
        ch.append('They had to say ');
        ch.appendChild(el('b', '', v.challenge_code.split('').join(' ')));
        ch.append(' and ');
        ch.appendChild(el('b', '', v.challenge_action));
        card.appendChild(ch);

        // Private video link that expires in 2 minutes
        const { data: vs } = await db.storage.from('verification-videos').createSignedUrl(v.video_path, 120);
        const video = el('video');
        video.controls = true; video.playsInline = true;
        video.setAttribute('controlsList', 'nodownload noplaybackrate');
        video.disablePictureInPicture = true;
        if (vs) video.src = vs.signedUrl;
        card.appendChild(video);

        // Their photos
        const { data: ph } = await db.from('profile_photos')
          .select('path').eq('user_id', v.user_id).order('position');
        const grid = el('div', 'photos');
        if (ph && ph.length) {
          const { data: urls } = await db.storage.from('profile-photos')
            .createSignedUrls(ph.map(x => x.path), 120);
          (urls || []).forEach(u => { const img = el('img'); img.src = u.signedUrl; grid.appendChild(img); });
        } else {
          grid.appendChild(el('p', 'meta', 'No photos uploaded'));
        }
        card.appendChild(grid);

        const check = el('ul', 'check');
        ['Same person in video and photos', 'Looks 18+', 'Said the code and did the action', 'Photos follow the rules']
          .forEach(t => check.appendChild(el('li', '', t)));
        card.appendChild(check);

        const btns = el('div', 'btns');
        const ok = el('button', 'ok', '✅ Approve');
        const no = el('button', 'no', '❌ Reject');
        ok.onclick = () => decide(v, true, ok, no);
        no.onclick = () => decide(v, false, ok, no);
        btns.append(ok, no);
        card.appendChild(btns);

        list.appendChild(card);
      }
    }

    async function decide(v, approve, ok, no) {
      let reason = null;
      if (!approve) {
        reason = prompt('Reason for rejection (the member will see this):', 'Face not clear, please record again');
        if (reason === null) return;
      }
      ok.disabled = no.disabled = true;

      const { error } = await db.from('verifications').update({
        status: approve ? 'approved' : 'rejected',
        reason: reason,
        reviewed_at: new Date().toISOString(),
        reviewed_by: adminId
      }).eq('id', v.id);
      if (error) { msg('Error: ' + error.message); ok.disabled = no.disabled = false; return; }

      // Delete the video for good
      const del = await db.storage.from('verification-videos').remove([v.video_path]);

      if (approve) {
        await db.from('profiles').update({ status: 'approved' }).eq('id', v.user_id);
      }
      await db.from('admin_log').insert({
        admin_id: adminId,
        action: approve ? 'approved_video' : 'rejected_video',
        target_user: v.user_id
      });

      msg(del.error
        ? 'Saved, but video could not be deleted: ' + del.error.message
        : (approve ? 'Approved ✅ Video deleted.' : 'Rejected. Video deleted.'), !del.error);
      load();
    }

    (async function start() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      adminId = session.user.id;
      const { data: me } = await db.from('profiles').select('is_admin').eq('id', adminId).single();
      if (!me || !me.is_admin) { window.location.href = 'dashboard.html'; return; }
      load();
    })();
  </script>
</body>
</html>
